# These tests read openflowlm-next files outside open_kernels/ and specs/ (src/, utilities/); they run in that tree.
# conftest.py additionally skips named upstream-runtime/native probes when their sources or compiler are absent.
[pytest]
testpaths = specs/open-engine/tests
addopts =
    -p no:cacheprovider
    --ignore=specs/open-engine/tests/test_spec_lookup.py
    --ignore=specs/open-engine/tests/test_wide_deltanet_chain.py
    --deselect=specs/open-engine/tests/test_quant_q4k.py::test_the_converters_writer_and_our_reader_agree_on_the_layout
    --deselect=specs/open-engine/tests/test_quant_q4k.py::test_a_source_that_cannot_be_read_as_q4k_still_packs_with_the_right_min_sign
    --deselect=specs/open-engine/tests/test_ternary_hadamard.py::test_converter_head_bands_are_the_ternary_weights_in_the_rotated_basis
    --deselect=specs/open-engine/tests/test_ternary_hadamard.py::test_converter_folds_the_hidden_signs_into_output_norm
    --deselect=specs/open-engine/tests/test_vision_vit_windowed.py::test_the_size_model_reproduces_a_shipped_container_exactly
    --deselect=specs/open-engine/tests/test_vision_vit_windowed.py::test_the_size_model_accounts_for_the_qwen2_5_language_container
