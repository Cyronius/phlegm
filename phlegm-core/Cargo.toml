[package]
name = "phlegm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Compiles the C-ABI xrt-shim and links XRT; needs MSVC (vcvars64) and xrt-shim/out/xrt_coreutil.lib.
npu = []

[dependencies]
minijinja = { version = "2.24.0", features = ["json"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
serde_json = "1"
tiny_http = "0.12.0"
tokenizers = "0.23.1"
