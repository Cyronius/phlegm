[package]
name = "phlegm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Compiles the C-ABI xrt-shim and links XRT (MSVC/import lib on Windows, C++17/XRT .so on Linux).
npu = []

[dependencies]
base64 = "0.13.1"
minijinja = { version = "2.24.0", features = ["json"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tiny_http = "0.12.0"
# esaxx_fast is a training-only C++ accelerator; inference uses the Rust path.
# Keep the default build free of a C++ compiler requirement.
tokenizers = { version = "0.23.1", default-features = false, features = ["progressbar", "onig"] }

[build-dependencies]
sha2 = "0.10.9"
