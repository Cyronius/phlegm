[package]
name = "open-qwen-npu"
version = "0.1.0"
edition = "2021"

[features]
# NPU decode driver: compiles + links the extern "C" xrt-shim over XRT.
# Requires MSVC (cl.exe reachable via vcvars64) and the XRT import lib. Off by
# default so the CPU engine builds without XRT present.
npu = []

[dependencies]
memmap2 = "0.9"
minijinja = { version = "2.24.0", features = ["json"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
serde_json = "1"
tiny_http = "0.12.0"
tokenizers = "0.23.1"

[profile.release]
debug = true
